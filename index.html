<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ECONOMY — STPM Presentation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #030712;

    color: white;

    font-family: "Inter", sans-serif;

    touch-action: manipulation;
}

body {

    user-select: none;

}


/* =====================================================
   PRESENTATION
===================================================== */

#presentation {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

}


/* =====================================================
   SLIDES
===================================================== */

.slide {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    padding:
        85px
        clamp(20px,6vw,90px)
        80px;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    transform:
        translateX(45px)
        scale(.98);

    pointer-events: none;

    transition:
        opacity .6s ease,
        transform .6s cubic-bezier(.16,1,.3,1);

}


.slide.active {

    opacity: 1;

    transform:
        translateX(0)
        scale(1);

    pointer-events: auto;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 1150px;

    margin: auto;

}


.grid {

    display: grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap: 70px;

    align-items: center;

}


/* =====================================================
   TEXT
===================================================== */

.kicker {

    color: #facc15;

    font-family: monospace;

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 22px;

}


.kicker.red {
    color: #f87171;
}

.kicker.blue {
    color: #60a5fa;
}

.kicker.green {
    color: #34d399;
}

.kicker.purple {
    color: #c084fc;
}


.title {

    font-size:
        clamp(50px,7vw,90px);

    line-height: .92;

    font-weight: 800;

    letter-spacing: -4px;

    margin: 0 0 25px;

}


.heading {

    font-size:
        clamp(34px,4vw,58px);

    line-height: 1.04;

    font-weight: 800;

    letter-spacing: -2px;

    margin: 0 0 20px;

}


.subtitle {

    font-family:
        "Playfair Display",
        serif;

    font-style: italic;

    color: #fef3c7;

    font-size:
        clamp(19px,2.3vw,28px);

    line-height: 1.35;

    margin-bottom: 20px;

}


.description {

    color: #cbd5e1;

    font-size: 15px;

    line-height: 1.8;

    max-width: 600px;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 28px;

    z-index: 1000;

    pointer-events: none;

}


.badge {

    border:
        1px solid
        rgba(250,204,21,.3);

    color: #facc15;

    padding:
        7px 12px;

    border-radius: 999px;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

}


.counter {

    color: #94a3b8;

    font-family: monospace;

    font-size: 13px;

}


/* =====================================================
   GLASS
===================================================== */

.glass {

    background:
        rgba(15,23,42,.76);

    border:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-radius: 24px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.35);

}


/* =====================================================
   TAGS
===================================================== */

.tags {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 25px;

}


.tag {

    padding:
        8px 13px;

    border-radius: 999px;

    background:
        rgba(30,41,59,.8);

    border:
        1px solid
        rgba(148,163,184,.15);

    color: #facc15;

    font-size: 11px;

    font-weight: 600;

}


/* =====================================================
   ECONOMIC ORBIT
===================================================== */

.orbit {

    position: relative;

    width:
        min(420px,80vw);

    aspect-ratio: 1;

    margin: auto;

}


.orbit-ring {

    position: absolute;

    inset: 5%;

    border:
        1px dashed
        rgba(148,163,184,.35);

    border-radius: 50%;

    animation:
        rotate 30s linear infinite;

}


.orbit-ring.two {

    inset: 18%;

    border:
        1px solid
        rgba(148,163,184,.12);

    animation:
        rotate 20s linear infinite reverse;

}


.coin {

    position: absolute;

    width: 105px;
    height: 105px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #fde68a,
            #ca8a04
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: #111827;

    font-size: 40px;

    box-shadow:
        0 0 60px
        rgba(234,179,8,.35);

    animation:
        coinFloat 4s ease-in-out infinite;

}


.node {

    position: absolute;

    padding:
        12px 15px;

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 11px;

    font-weight: 600;

    white-space: nowrap;

}


.node i {

    color: #facc15;

}


.people {

    top: 0;

    left: 50%;

    transform:
        translateX(-50%);

}


.business {

    right: -10px;

    top: 32%;

}


.resources {

    left: -10px;

    top: 32%;

}


.goods {

    bottom: 0;

    left: 50%;

    transform:
        translateX(-50%);

}


/* =====================================================
   INFO BOX
===================================================== */

.info-box {

    padding: 18px;

    border-radius: 16px;

    margin-top: 15px;

    background:
        rgba(15,23,42,.75);

    border:
        1px solid
        rgba(148,163,184,.12);

}


.info-title {

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 6px;

}


.info-text {

    font-size: 12px;

    line-height: 1.6;

    color: #94a3b8;

}


/* =====================================================
   HERO SCENE
===================================================== */

.hero-scene {

    height: 430px;

    position: relative;

    overflow: hidden;

    border-radius: 28px;

    background:

        radial-gradient(
            circle at 75% 20%,
            rgba(96,165,250,.15),
            transparent 20%
        ),

        linear-gradient(
            180deg,
            #020617,
            #0f172a 65%,
            #111827
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);

}


/* moon */

.moon {

    position: absolute;

    width: 90px;
    height: 90px;

    right: 50px;
    top: 40px;

    border-radius: 50%;

    background: #f8fafc;

    box-shadow:
        0 0 60px
        rgba(255,255,255,.15);

}


/* city */

.city {

    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    height: 130px;

    display: flex;

    align-items: end;

    justify-content:
        space-around;

    opacity: .45;

}


.building {

    width: 12%;

    background: #020617;

    border-top:
        1px solid
        rgba(96,165,250,.25);

    position: relative;

}


.building:nth-child(1) {
    height: 55%;
}

.building:nth-child(2) {
    height: 85%;
}

.building:nth-child(3) {
    height: 65%;
}

.building:nth-child(4) {
    height: 100%;
}

.building:nth-child(5) {
    height: 70%;
}

.building:nth-child(6) {
    height: 90%;
}


.building::after {

    content: "";

    position: absolute;

    inset: 12px 7px;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(250,204,21,.25)
            0 3px,
            transparent
            3px 15px
        );

}


/* rope */

.rope {

    position: absolute;

    width: 2px;

    height: 125px;

    background: #94a3b8;

    top: 0;
    left: 45%;

    transform:
        rotate(12deg);

}


/* =====================================================
   MASKED HERO
===================================================== */

.masked-hero {

    position: absolute;

    top: 83px;
    left: 40%;

    width: 125px;
    height: 180px;

    transform:
        rotate(10deg);

    animation:
        heroFloat 4s ease-in-out infinite;

}


/* head */

.hero-head {

    position: absolute;

    width: 58px;
    height: 64px;

    left: 33px;
    top: 0;

    border-radius:
        48% 48% 45% 45%;

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #7f1d1d
        );

    border:
        2px solid
        #ef4444;

}


.eye {

    position: absolute;

    width: 17px;
    height: 27px;

    background: white;

    border:
        2px solid
        #111827;

    transform:
        skewX(-12deg);

}


.eye.left {

    left: 10px;
    top: 18px;

}


.eye.right {

    right: 10px;
    top: 18px;

}


/* body */

.hero-body {

    position: absolute;

    top: 52px;
    left: 22px;

    width: 80px;
    height: 100px;

    background:
        linear-gradient(
            145deg,
            #1e40af,
            #172554
        );

    border-radius:
        35px 35px 18px 18px;

    border:
        2px solid
        #3b82f6;

}


.emblem {

    position: absolute;

    left: 28px;
    top: 22px;

    color: #f8fafc;

    font-size: 22px;

}


/* limbs */

.arm,
.leg {

    position: absolute;

    background: #172554;

    border:
        2px solid
        #3b82f6;

    border-radius: 15px;

}


.arm {

    width: 20px;
    height: 85px;

}


.arm.left {

    left: 4px;
    top: 58px;

    transform:
        rotate(42deg);

}


.arm.right {

    right: 4px;
    top: 60px;

    transform:
        rotate(-55deg);

}


.leg {

    width: 25px;
    height: 80px;

}


.leg.left {

    left: 30px;
    top: 130px;

    transform:
        rotate(35deg);

}


.leg.right {

    right: 30px;
    top: 130px;

    transform:
        rotate(-25deg);

}


/* threads */

.thread {

    position: absolute;

    height: 1px;

    background:
        rgba(255,255,255,.25);

    transform-origin:
        left;

}


.thread.one {

    width: 180px;

    left: 35%;
    top: 260px;

    transform:
        rotate(-30deg);

}


.thread.two {

    width: 130px;

    left: 45%;
    top: 270px;

    transform:
        rotate(25deg);

}


/* hero label */

.hero-label {

    position: absolute;

    left: 25px;
    bottom: 25px;

    z-index: 10;

}


/* =====================================================
   MALAYSIA METRICS
===================================================== */

.metric-grid {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 12px;

}


.metric {

    padding: 25px 12px;

    text-align: center;

    border-radius: 18px;

    background:
        rgba(15,23,42,.8);

    border:
        1px solid
        rgba(255,255,255,.06);

}


.metric i {

    font-size: 25px;

    margin-bottom: 12px;

    color: #60a5fa;

}


.metric strong {

    display: block;

    font-size: 12px;

    color: #e2e8f0;

}


.metric span {

    display: block;

    margin-top: 7px;

    font-size: 10px;

    color: #f87171;

}


/* =====================================================
   EDUCATION
===================================================== */

.education-card {

    padding: 25px;

    border-radius: 22px;

    background:

        linear-gradient(
            145deg,
            rgba(16,185,129,.10),
            rgba(15,23,42,.8)
        );

    border:
        1px solid
        rgba(52,211,153,.15);

}


.progress {

    height: 8px;

    background: #1e293b;

    border-radius: 99px;

    margin-top: 15px;

    overflow: hidden;

}


.progress-bar {

    width: 78%;

    height: 100%;

    background: #34d399;

    border-radius: 99px;

}


/* =====================================================
   CHOICE
===================================================== */

.choice {

    display: grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items: center;

    gap: 15px;

    margin-top: 25px;

}


.choice-card {

    padding: 22px;

    text-align: center;

    border-radius: 20px;

    background:
        rgba(15,23,42,.75);

    border:
        1px solid
        rgba(255,255,255,.07);

}


.choice-card i {

    font-size: 28px;

    color: #facc15;

    margin-bottom: 12px;

}


.arrow {

    color: #64748b;

}


/* =====================================================
   FINAL
===================================================== */

.final {

    text-align: center;

}


.final .big {

    font-size:
        clamp(45px,8vw,100px);

    font-weight: 800;

    letter-spacing: -5px;

}


.final-line {

    width: 80px;

    height: 2px;

    background: #facc15;

    margin: 25px auto;

}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    position: fixed !important;

    z-index: 99999 !important;

    bottom: 18px !important;

    left: 50% !important;

    transform:
        translateX(-50%) !important;

    display: flex !important;

    align-items: center !important;

    gap: 10px !important;

    pointer-events: auto !important;

}


.control {

    position: relative !important;

    z-index: 100000 !important;

    width: 48px !important;
    height: 48px !important;

    display: flex !important;

    align-items: center !important;

    justify-content: center !important;

    border-radius: 50% !important;

    border:
        1px solid
        rgba(255,255,255,.2) !important;

    background:
        rgba(15,23,42,.95) !important;

    color: white !important;

    cursor: pointer !important;

    pointer-events: auto !important;

    touch-action:
        manipulation !important;

}


.control:active {

    transform:
        scale(.88);

    background:
        rgba(51,65,85,1) !important;

}


.control i {

    pointer-events: none;

}


/* =====================================================
   PROGRESS
===================================================== */

.progress-line {

    position: fixed;

    left: 0;
    bottom: 0;

    height: 3px;

    background: #facc15;

    width: 16.666%;

    transition:
        width .5s ease;

    z-index: 99990;

}


/* =====================================================
   TAP ZONES
===================================================== */

.tap-left,
.tap-right {

    position: fixed;

    top: 80px;

    bottom: 80px;

    width: 25%;

    z-index: 50;

}


.tap-left {

    left: 0;

}


.tap-right {

    right: 0;

}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


@keyframes coinFloat {

    0%,100% {

        transform:
            translate(-50%,-50%)
            translateY(0);

    }

    50% {

        transform:
            translate(-50%,-50%)
            translateY(-12px);

    }

}


@keyframes heroFloat {

    0%,100% {

        transform:
            rotate(10deg)
            translateY(0);

    }

    50% {

        transform:
            rotate(8deg)
            translateY(-12px);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    .topbar {

        height: 60px;

        padding:
            0 15px;

    }


    .badge {

        font-size: 8px;

        letter-spacing: 1px;

    }


    .slide {

        align-items:
            flex-start;

        padding:
            75px
            20px
            75px;

    }


    .grid {

        grid-template-columns: 1fr;

        gap: 20px;

        width: 100%;

        max-height: 82vh;

        overflow-y: auto;

        scrollbar-width: none;

    }


    .grid::-webkit-scrollbar {

        display: none;

    }


    .title {

        font-size: 54px;

        letter-spacing:
            -3px;

    }


    .heading {

        font-size: 34px;

    }


    .subtitle {

        font-size: 19px;

    }


    .description {

        font-size: 13px;

        line-height: 1.7;

    }


    .orbit {

        width: 275px;

    }


    .coin {

        width: 80px;
        height: 80px;

        font-size: 30px;

    }


    .node {

        font-size: 8px;

        padding:
            7px 9px;

    }


    .business {

        right: -2px;

    }


    .resources {

        left: -2px;

    }


    .hero-scene {

        height: 285px;

    }


    .moon {

        width: 65px;
        height: 65px;

        right: 30px;
        top: 25px;

    }


    .masked-hero {

        transform:
            scale(.75)
            rotate(10deg);

        left: 33%;

        top: 55px;

    }


    .city {

        height: 90px;

    }


    .metric {

        padding:
            15px 7px;

    }


    .metric i {

        font-size: 20px;

    }


    .choice {

        grid-template-columns:
            1fr;

    }


    .arrow {

        transform:
            rotate(90deg);

        text-align:
            center;

    }


    .controls {

        bottom: 10px !important;

    }


    .control {

        width: 42px !important;
        height: 42px !important;

    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media(max-width:420px) {

    .heading {

        font-size: 30px;

    }


    .title {

        font-size: 48px;

    }


    .hero-scene {

        height: 250px;

    }


    .education-card {

        padding: 18px;

    }


    .info-box {

        padding: 14px;

    }

}

</style>

</head>


<body>


<div id="presentation">


<!-- =================================================
     TOP BAR
================================================= -->

<header class="topbar">

    <div>

        <span class="badge">
            STPM PRESENTATION
        </span>

    </div>

    <div class="counter">

        <span id="counter">
            01
        </span>

        / 06

    </div>

</header>


<!-- =================================================
     TAP ZONES
================================================= -->

<div
    class="tap-left"
    id="tapLeft">
</div>

<div
    class="tap-right"
    id="tapRight">
</div>


<!-- =================================================
     SLIDE 1
================================================= -->

<section
    class="slide active"
    id="slide1">

<div class="container">

<div class="grid">


<div>

<div class="kicker">
01 — FUNDAMENTALS
</div>


<h1 class="title">
ECONOMY
</h1>


<div class="subtitle">

“Simply put,
